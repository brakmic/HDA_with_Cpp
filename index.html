<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HDA with htmx and C++</title>
    <link rel="icon" type="image/x-icon" href="cpp_favicon.ico" />
    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="vendor/bootstrap-5.3.5-dist/css/bootstrap.min.css"
    />
    <!-- Font Awesome 6 (local, with webfonts) -->
    <link
      rel="stylesheet"
      href="vendor/fontawesome-free-6.7.2-web/css/fontawesome.min.css"
    />
    <link
      rel="stylesheet"
      href="vendor/fontawesome-free-6.7.2-web/css/brands.min.css"
    />
    <link
      rel="stylesheet"
      href="vendor/fontawesome-free-6.7.2-web/css/solid.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div id="main" class="container flex-grow-1">
      <div class="p-5 mt-4 mb-4 bg-body-tertiary rounded-3">
        <div class="row">
          <div class="col-12">
            <h1>Hypermedia-driven web apps</h1>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-lg-8 offset-lg-2 col-md-10 offset-md-1">
            <div class="card">
              <div class="card-header">
                <h5 class="card-title mb-0">
                  HDAs with <strong>htmx</strong> and
                  <strong>Drogon C++ web framework</strong>
                </h5>
              </div>
              <div class="card-body text-center">
                <figure class="figure">
                  <img
                    class="figure-img img-fluid rounded"
                    width="630"
                    src="videos/htmx_with_cpp.gif"
                    alt="Demo screenshot"
                  />
                </figure>
              </div>
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-12 text-center">
            <a
              class="btn btn-success btn-lg me-2"
              role="button"
              href="https://github.com/brakmic/HDA-Demo"
              ><i class="fa-brands fa-square-github fa-lg"></i>
              Get sources
            </a>
            <button
              class="btn btn-primary btn-lg"
              hx-get="/contacts"
              hx-target="#main"
              hx-swap="innerHTML"
            >
              <i class="fa-solid fa-cloud-bolt fa-lg"></i>
              Run demo
            </button>
          </div>
        </div>
      </div>
    </div>
    <footer class="py-3 bg-body-tertiary mt-auto">
      <div class="container text-center">
        <span class="text-body-secondary"
          ><a href="https://brakmic.com" target="_blank"
            >Built with <i class="fa-solid fa-heart"></i> and C++ by Harris Brakmic</a
          ></span
        >
      </div>
    </footer>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="vendor/bootstrap-5.3.5-dist/js/bootstrap.bundle.min.js"></script>
    <!-- hyperscript -->
    <script src="vendor/hyperscript.min.js"></script>
    <!-- htmx -->
    <script src="vendor/htmx.min.js"></script>
  </body>
</html>
